<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HISVIA Asset Manager — 681 Industrial Assets</title>
<style>
:root{
  --bg:#f0f2f5;--card:#fff;--border:#e2e4e9;--text:#1a1a2e;--muted:#6b7280;
  --c-brand:#1a6fb2;--c-product:#2e7d32;--c-part:#e65100;--c-mfg:#7b1fa2;--c-doc:#c62828;--c-unknown:#6d4c41;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:10}
.top-bar h1{font-size:18px;margin-bottom:2px}
.top-bar .sub{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
.filters label{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:500}
.filters select,.filters input{padding:5px 9px;border:1px solid var(--border);border-radius:5px;font-size:12px;outline:none;background:var(--bg)}
.filters select:focus,.filters input:focus{border-color:#89b4fa}
.filters input{width:180px}
.count-badge{font-size:11px;color:var(--muted);margin-left:auto;background:var(--bg);padding:5px 10px;border-radius:16px;white-space:nowrap}
.reset-btn{padding:5px 10px;border:1px solid var(--border);border-radius:5px;font-size:11px;cursor:pointer;background:var(--bg);color:var(--muted)}
.reset-btn:hover{background:#e8e8e8}
.grid{padding:14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:7px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .12s}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card .img-wrap{position:relative;height:140px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden}
.card .img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.card .img-wrap .type-badge{position:absolute;top:5px;left:5px;padding:1px 6px;border-radius:2px;font-size:8px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.t-brand{background:var(--c-brand)}.t-product{background:var(--c-product)}.t-part{background:var(--c-part)}
.t-manufacturing_asset{background:var(--c-mfg)}.t-unknown{background:var(--c-unknown)}
.card .img-wrap .brand-tag{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.72);color:#fff;font-size:8px;padding:1px 5px;border-radius:2px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .info{padding:6px 8px}
.card .info .fname{font-size:9px;font-family:"SF Mono",monospace;color:var(--muted);word-break:break-all;margin-bottom:1px;line-height:1.3}
.card .info .meta{font-size:8px;color:#aaa;display:flex;gap:5px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:100}
.overlay.show{display:flex;align-items:center;justify-content:center}
.panel{background:var(--card);border-radius:10px;max-width:620px;width:92%;max-height:88vh;overflow-y:auto}
.panel .p-img{background:#fafafa;display:flex;align-items:center;justify-content:center;min-height:180px;max-height:350px;overflow:hidden;border-bottom:1px solid var(--border)}
.panel .p-img img{max-width:100%;max-height:340px;object-fit:contain}
.panel .p-info{padding:14px 18px}
.panel .p-info h3{font-size:13px;margin-bottom:10px;word-break:break-all}
.panel .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}
.panel .p-grid .lbl{color:var(--muted);font-weight:500}
.panel .p-grid .val{color:var(--text);word-break:break-all}
.panel .p-usage{margin-top:10px}
.panel .p-usage .tag{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9px;margin:1px;background:#e3f2fd;color:var(--c-brand)}
.conf-bar{display:flex;align-items:center;gap:5px}
.conf-bar .bg{flex:1;height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden}
.conf-bar .fill{height:100%;border-radius:2px}
.c-high{background:#4caf50}.c-mid{background:#ff9800}.c-low{background:#f44336}
.empty{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1}
.loading{text-align:center;padding:80px 20px;color:var(--muted);grid-column:1/-1;font-size:14px}
@media(max-width:768px){
  .filters{flex-direction:column;align-items:stretch}
  .filters input{width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
  .panel .p-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top-bar">
<h1>HISVIA Asset Manager</h1>
<div class="sub">AI-Ready Visual Asset Database &middot; <span id="totalCount">681</span> assets &middot; JSON-driven</div>
</div>

<div class="filters">
<label>Type</label>
<select id="fType" onchange="apply()">
<option value="">All</option>
<option value="brand_asset">brand</option><option value="manufacturing_asset">manufacturing</option><option value="part_asset">part</option><option value="product_asset">product</option>
</select>

<label>Brand</label>
<select id="fBrand" onchange="apply()">
<option value="">All</option>
<option value="Atlas Copco">Atlas Copco</option><option value="CompAir">CompAir</option><option value="Eaton">Eaton</option><option value="Emerson">Emerson</option><option value="Gardner Denver">Gardner Denver</option><option value="Hitachi">Hitachi</option><option value="Ingersoll Rand">Ingersoll Rand</option><option value="KUKA">KUKA</option><option value="Kaeser">Kaeser</option><option value="Kawasaki">Kawasaki</option><option value="Metso">Metso</option><option value="Sullair">Sullair</option><option value="Sulzer">Sulzer</option><option value="Wilo">Wilo</option><option value="Yaskawa">Yaskawa</option><option value="Yuken">Yuken</option>
</select>

<label>Category</label>
<select id="fCat" onchange="apply()">
<option value="">All</option>
<option value="automation">automation</option><option value="bearing">bearing</option><option value="compressor">compressor</option><option value="coupling">coupling</option><option value="dryer">dryer</option><option value="filter">filter</option><option value="gearbox">gearbox</option><option value="hydraulic">hydraulic</option><option value="oil-separator">oil-separator</option><option value="pump">pump</option><option value="seal">seal</option><option value="valve">valve</option>
</select>

<label>Source</label>
<select id="fSrc" onchange="apply()">
<option value="">All</option>
<option value="_brand">_brand</option><option value="_docx">_docx</option><option value="_docx2">_docx2</option><option value="_docx3">_docx3</option><option value="_docx5">_docx5</option><option value="_docx6">_docx6</option><option value="_final">_final</option>
</select>

<input type="text" id="fSearch" placeholder="Search..." oninput="apply()"/>

<span class="count-badge" id="badge">681 / 681</span>
<button class="reset-btn" onclick="resetAll()">Reset</button>
</div>

<div class="grid" id="grid"><div class="loading">Loading asset database...</div></div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeDetail()">
<div class="panel" id="panel"></div>
</div>

<script>
var ASSETS=[],filtered=[];

function tc(t){return't-'+t;}
function cc(v){return v>=0.7?'c-high':v>=0.4?'c-mid':'c-low';}
function eh(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function apply(){
  var t=document.getElementById('fType').value;
  var b=document.getElementById('fBrand').value;
  var c=document.getElementById('fCat').value;
  var s=document.getElementById('fSrc').value;
  var q=document.getElementById('fSearch').value.toLowerCase().trim();
  filtered=ASSETS.filter(function(a){
    if(t&&a.asset_type!==t)return false;
    if(b&&a.brand!==b)return false;
    if(c&&a.category!==c)return false;
    if(s&&a.source_group!==s)return false;
    if(q){var h=(a.original_filename+' '+a.brand+' '+a.category+' '+a.asset_type+' '+a.source_group+' '+a.notes).toLowerCase();if(h.indexOf(q)===-1)return false;}
    return true;
  });
  document.getElementById('badge').textContent=filtered.length+' / '+ASSETS.length;
  render();
}

function resetAll(){
  document.getElementById('fType').value='';
  document.getElementById('fBrand').value='';
  document.getElementById('fCat').value='';
  document.getElementById('fSrc').value='';
  document.getElementById('fSearch').value='';
  filtered=ASSETS.slice();
  document.getElementById('badge').textContent=ASSETS.length+' / '+ASSETS.length;
  render();
}

function render(){
  var g=document.getElementById('grid');
  if(!filtered.length){g.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:8px">📭</div><p>No results</p></div>';return;}
  var h='';
  for(var i=0;i<filtered.length;i++){
    var a=filtered[i];
    var bd=a.asset_type.replace(/_/g,' ').replace('asset','').trim();
    var bt=a.brand?'<span class="brand-tag">'+eh(a.brand)+'</span>':'';
    var cm=a.category?'<span>'+a.category+'</span>':'';
    h+='<div class="card" onclick="show('+i+')">'+
      '<div class="img-wrap">'+
      '<img loading="lazy" src="'+a.path+'" alt=""/>'+
      '<span class="type-badge '+tc(a.asset_type)+'">'+bd+'</span>'+bt+
      '</div>'+
      '<div class="info">'+
      '<div class="fname">'+eh(a.original_filename)+'</div>'+
      '<div class="meta"><span>'+a.source_group+'</span>'+cm+'</div>'+
      '</div></div>';
  }
  g.innerHTML=h;
}

function show(i){
  var a=filtered[i];if(!a)return;
  var p=document.getElementById('panel');
  var tl=a.asset_type.replace(/_/g,' ');
  var cp=Math.round(a.confidence*100);
  var cb=cc(a.confidence);
  var ut='';
  for(var u=0;u<a.recommended_usage.length;u++)ut+='<span class="tag">'+eh(a.recommended_usage[u])+'</span>';
  p.innerHTML=
    '<div class="p-img"><img src="'+a.path+'" alt=""/></div>'+
    '<div class="p-info">'+
    '<h3>'+eh(a.original_filename)+'</h3>'+
    '<div class="p-grid">'+
    '<div class="lbl">ID</div><div class="val" style="font-family:monospace;font-size:10px">'+a.id+'</div>'+
    '<div class="lbl">Type</div><div class="val"><span class="type-badge '+tc(a.asset_type)+'" style="position:static;display:inline-block">'+tl+'</span></div>'+
    '<div class="lbl">Brand</div><div class="val">'+(a.brand||'—')+'</div>'+
    '<div class="lbl">Category</div><div class="val">'+(a.category||'—')+'</div>'+
    '<div class="lbl">Source</div><div class="val">'+a.source_group+'</div>'+
    '<div class="lbl">Size</div><div class="val">'+(a.file_size/1024).toFixed(1)+' KB</div>'+
    '<div class="lbl">Status</div><div class="val">'+a.status+'</div>'+
    '<div class="lbl">Confidence</div><div class="val"><div class="conf-bar"><div class="bg"><div class="fill '+cb+'" style="width:'+cp+'%"></div></div><span>'+cp+'%</span></div></div>'+
    '</div>'+
    '<div class="p-usage"><strong style="font-size:10px;color:var(--muted)">Usage:</strong> '+(ut||'<span style="font-size:10px;color:#aaa">—</span>')+'</div>'+
    (a.notes?'<div style="margin-top:6px;font-size:10px;color:var(--muted)">📝 '+eh(a.notes)+'</div>':'')+
    '<div style="margin-top:6px;font-size:9px;color:#aaa">'+a.path+'</div>'+
    '</div>';
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeDetail();
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('fSearch').focus();}
});

fetch('/assets/asset-index.json')
  .then(function(r){return r.json();})
  .then(function(d){
    ASSETS=d;filtered=d.slice();
    document.getElementById('badge').textContent=d.length+' / '+d.length;
    render();
  })
  .catch(function(err){
    document.getElementById('grid').innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:8px">❌</div><p>Failed to load: '+eh(err.message)+'</p></div>';
  });
</script>
</body>
</html>
