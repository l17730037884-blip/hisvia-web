<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HISVIA AI Pipeline V2 — Visual Review</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--border:#2a2a4a;--text:#e0e0e0;--muted:#8892a4;--accent:#4fc3f7;--green:#66bb6a;--red:#ef5350;--orange:#ffa726}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:0;z-index:10}
header h1{font-size:20px;color:#fff}
header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.review-item{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:20px 24px;overflow:hidden}
.review-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
.review-header .info{flex:1;min-width:200px}
.review-header .info h3{font-size:15px;color:#fff;margin-bottom:2px}
.review-header .info .meta{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.review-header .info .meta span{background:rgba(255,255,255,.05);padding:2px 8px;border-radius:4px}
.review-header .actions{display:flex;gap:8px}
.review-header .actions button{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .15s}
.btn-approve{background:rgba(102,187,106,.15);color:var(--green);border-color:var(--green)!important}
.btn-approve:hover{background:rgba(102,187,106,.25)}
.btn-approve.active{background:var(--green);color:#fff}
.btn-reject{background:rgba(239,83,80,.15);color:var(--red);border-color:var(--red)!important}
.btn-reject:hover{background:rgba(239,83,80,.25)}
.btn-reject.active{background:var(--red);color:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.compare-col{padding:16px;background:var(--card)}
.compare-col h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.compare-col .img-box{background:#0a0a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:200px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.compare-col .img-box img{max-width:100%;max-height:400px;object-fit:contain}
.variants-section{padding:14px 20px;border-top:1px solid var(--border)}
.variants-section h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.variants-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.variant-card{min-width:180px;max-width:220px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.variant-card .v-img{background:#0a0a1a;height:130px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
.variant-card .v-img img{max-width:100%;max-height:120px;object-fit:contain}
.variant-card .v-label{padding:6px 8px;font-size:10px;text-align:center}
.variant-card .v-label .t{color:var(--accent);font-weight:600;text-transform:uppercase}
.variant-card .v-label .s{color:var(--muted);font-size:9px;display:block}
.analysis-bar{padding:10px 20px;border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;font-size:11px;align-items:center}
.analysis-bar .metric{display:flex;align-items:center;gap:6px}
.analysis-bar .metric .m-label{color:var(--muted)}
.analysis-bar .metric .m-val{font-weight:600}
.analysis-bar .score-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-excellent{background:var(--green)}.s-good{background:var(--orange)}.s-fair{background:var(--red)}
.status-approved{border-left:3px solid var(--green)}
.status-rejected{border-left:3px solid var(--red)}
.summary-bar{display:flex;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);align-items:center}
.summary-bar .count{font-weight:700;font-size:16px}
.empty{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:768px){.compare{grid-template-columns:1fr}.variants-grid{flex-wrap:wrap}}
</style>
</head>

var reviews = {};

function renderAll(){
    var h='';
    for(var i=0;i<DATA.length;i++){
        var d=DATA[i];
        var status=reviews[d.id]||'pending';
        var a=d.analysis||{};
        var qs=a.quality_scores||{};
        var ql=a.commercial_quality||'';
        var sc=ql==='excellent'?'s-excellent':ql==='good'?'s-good':'s-fair';
        
        // Variants
        var vars='';
        for(var j=0;j<d.processed_files.length;j++){
            var pf=d.processed_files[j];
            vars+='<div class="variant-card"><div class="v-img"><img loading="lazy" src="'+pf.path+'" alt=""/></div><div class="v-label"><span class="t">'+pf.type+'</span><span class="s">'+pf.width+'x'+pf.height+'</span></div></div>';
        }
        
        // Analysis metrics
        var metrics='';
        if(Object.keys(qs).length>0){
            metrics+='<div class="metric"><span class="m-label">Resolution</span><span class="m-val">'+(qs.resolution*100).toFixed(0)+'%</span></div>';
            metrics+='<div class="metric"><span class="m-label">Sharpness</span><span class="m-val">'+(qs.sharpness*100).toFixed(0)+'%</span></div>';
            metrics+='<div class="metric"><span class="m-label">Contrast</span><span class="m-val">'+(qs.contrast*100).toFixed(0)+'%</span></div>';
            metrics+='<div class="metric"><span class="m-label">Quality</span><span class="score-dot '+sc+'"></span><span class="m-val">'+ql+'</span></div>';
        }
        if(a.background_type) metrics+='<div class="metric"><span class="m-label">BG</span><span class="m-val">'+a.background_type+'</span></div>';
        
        h+='<div class="review-item status-'+status+'" id="item-'+d.id+'">'+
        '<div class="review-header">'+
        '<div class="info">'+
        '<h3>'+esc(d.filename)+'</h3>'+
        '<div class="meta">'+
        '<span>'+d.asset_type.replace(/_/g,' ')+'</span>'+
        (d.brand?'<span>'+esc(d.brand)+'</span>':'')+
        '<span>'+d.category_lv1+'/'+d.category_lv2+'</span>'+
        '<span>'+d.processing_method+'</span>'+
        '<span>Score: '+(d.quality_score*100).toFixed(0)+'%</span>'+
        '</div></div>'+
        '<div class="actions">'+
        '<button class="btn-approve'+(status==='approved'?' active':'')+'" onclick="mark(''+d.id+'','approved')">✓ Approve</button>'+
        '<button class="btn-reject'+(status==='rejected'?' active':'')+'" onclick="mark(''+d.id+'','rejected')">✕ Reject</button>'+
        '</div></div>'+
        '<div class="compare">'+
        '<div class="compare-col"><h4>📷 Original</h4><div class="img-box"><img loading="lazy" src="'+d.original_path+'" alt=""/></div></div>'+
        '<div class="compare-col"><h4>✨ Processed (best variant)</h4><div class="img-box"><img loading="lazy" src="'+(d.processed_files[0]?d.processed_files[0].path:d.original_path)+'" alt=""/></div></div>'+
        '</div>'+
        '<div class="variants-section"><h4>🎨 All Variants ('+d.processed_files.length+')</h4><div class="variants-grid">'+vars+'</div></div>'+
        (metrics?'<div class="analysis-bar">'+metrics+'</div>':'')+
        '</div>';
    }
    document.getElementById('reviewContainer').innerHTML=h;
    updateCounts();
}

function mark(id,status){
    reviews[id]=status;
    var el=document.getElementById('item-'+id);
    el.className='review-item status-'+status;
    el.querySelector('.btn-approve').className='btn-approve'+(status==='approved'?' active':'');
    el.querySelector('.btn-reject').className='btn-reject'+(status==='rejected'?' active':'');
    updateCounts();
}

function updateCounts(){
    var a=0,r=0;
    for(var k in reviews){if(reviews[k]==='approved')a++;if(reviews[k]==='rejected')r++;}
    document.getElementById('approvedCount').textContent=a;
    document.getElementById('rejectedCount').textContent=r;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

renderAll();
</script>
