<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抠图审核对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .sub { color: #888; font-size: 0.8rem; margin-bottom: 20px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
    border: 1px solid #333; border-radius: 10px; overflow: hidden; background: #222; }
  .pair-header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: #2a2a2a; border-bottom: 1px solid #333; }
  .pair-header .name { font-weight: 700; font-size: 0.95rem; }
  .pair-header .status { font-size: 0.75rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .status-pending { background: #3a3a2a; color: #d4d476; }
  .status-pass { background: #1a3a1a; color: #6ec06e; }
  .status-retry { background: #3a2a1a; color: #c0946e; }
  .status-drop { background: #3a1a1a; color: #c06e6e; }
  .status-noneed { background: #1a2a3a; color: #6e9ec0; }
  .side { padding: 12px; }
  .side-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .img-box { position: relative; width: 100%; height: 240px; display: flex; align-items: center; justify-content: center;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border-radius: 6px; overflow: hidden;
  }
  .img-box.white { background: #1e1e1e; }
  .img-box img { max-width: 92%; max-height: 220px; object-fit: contain; }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  .btn { flex: 1; padding: 6px 0; border: 1px solid #444; border-radius: 5px; background: #2a2a2a;
    color: #ccc; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: #666; background: #333; }
  .btn.active { color: #fff; }
  .btn-need.active { background: #2a4a6a; border-color: #3a6a9a; }
  .btn-noneed.active { background: #1a2a3a; border-color: #2a4a6a; }
  .btn-pass.active { background: #1a3a1a; border-color: #2a6a2a; }
  .btn-retry.active { background: #3a2a1a; border-color: #6a4a2a; }
  .btn-drop.active { background: #3a1a1a; border-color: #6a2a2a; }
  .actions-bar { position: sticky; top: 0; z-index: 100; background: #1a1a1a; padding: 12px 0;
    border-bottom: 1px solid #333; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
  .actions-bar .count { font-size: 0.8rem; color: #888; }
  .actions-bar button { padding: 6px 14px; border: 1px solid #444; border-radius: 5px; background: #2a2a2a;
    color: #ccc; font-size: 0.8rem; cursor: pointer; }
  .actions-bar button:hover { background: #333; border-color: #666; }
</style>
</head>
<body>

<h1>抠图审核对比</h1>
<p class="sub">左=原图 / 右=抠图。棋盘格=透明区域。点击按钮操作，最后点"导出审核报告"。</p>

<div class="actions-bar">
  <span class="count" id="counter">加载中...</span>
  <button onclick="exportReport()">导出审核报告</button>
  <button onclick="location.reload()">刷新</button>
</div>

<div id="container"></div>

<script>
const ORIG_BASE = '../';
const CUT_BASE = './';
const ASSETS = [
  'ASSET-01','ASSET-02','ASSET-03','ASSET-04','ASSET-05','ASSET-06','ASSET-07','ASSET-08',
  'ASSET-10','ASSET-11','ASSET-12','ASSET-13','ASSET-15','ASSET-16','ASSET-17','ASSET-18',
  'ASSET-19','ASSET-20','ASSET-21','ASSET-22','ASSET-23','ASSET-24','ASSET-25','ASSET-26',
  'ASSET-27','ASSET-28','ASSET-29','ASSET-30','ASSET-31','ASSET-32','ASSET-33','ASSET-34',
  'ASSET-35','ASSET-36','ASSET-37','ASSET-38','ASSET-39','ASSET-44'
];

const decisions = {}; // { 'ASSET-01': { orig: 'need'|'noneed', cut: 'pass'|'retry'|'drop' } }

function getExt(name) {
  // 28,29,31 are png; rest are jpg
  return ['ASSET-28','ASSET-29','ASSET-31'].includes(name) ? 'png' : 'jpg';
}

function getStatus(name) {
  const d = decisions[name];
  if (!d) return 'pending';
  if (d.orig === 'noneed') return 'noneed';
  if (d.cut === 'pass') return 'pass';
  if (d.cut === 'retry') return 'retry';
  if (d.cut === 'drop') return 'drop';
  return 'pending';
}

function statusLabel(s) {
  return {pending:'待审', pass:'通过', retry:'继续扣', drop:'放弃', noneed:'无需扣'}[s] || '待审';
}

function renderPair(name) {
  const ext = getExt(name);
  const d = decisions[name] || {};
  const st = getStatus(name);
  const origSrc = `${ORIG_BASE}${name}.${ext}`;
  const cutSrc = `${CUT_BASE}${name}.png`;

  const origNeedActive = d.orig === 'need' ? 'active' : '';
  const origNoneedActive = d.orig === 'noneed' ? 'active' : '';
  const cutPassActive = d.cut === 'pass' ? 'active' : '';
  const cutRetryActive = d.cut === 'retry' ? 'active' : '';
  const cutDropActive = d.cut === 'drop' ? 'active' : '';

  return `
  <div class="pair" data-name="${name}">
    <div class="pair-header">
      <span class="name">${name}</span>
      <span class="status status-${st}">${statusLabel(st)}</span>
    </div>
    <div class="side">
      <div class="side-label">原图</div>
      <div class="img-box white">
        <img src="${origSrc}" alt="${name} orig" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#666;font-size:0.7rem>加载失败</span>'">
      </div>
      <div class="btns">
        <button class="btn btn-need ${origNeedActive}" onclick="decide('${name}','orig','need')">需扣</button>
        <button class="btn btn-noneed ${origNoneedActive}" onclick="decide('${name}','orig','noneed')">无需扣</button>
      </div>
    </div>
    <div class="side">
      <div class="side-label">抠图后</div>
      <div class="img-box">
        <img src="${cutSrc}" alt="${name} cutout" loading="lazy" onerror="this.parentElement.innerHTML='<span style=color:#666;font-size:0.7rem>加载失败</span>'">
      </div>
      <div class="btns">
        <button class="btn btn-pass ${cutPassActive}" onclick="decide('${name}','cut','pass')">通过</button>
        <button class="btn btn-retry ${cutRetryActive}" onclick="decide('${name}','cut','retry')">继续扣</button>
        <button class="btn btn-drop ${cutDropActive}" onclick="decide('${name}','cut','drop')">放弃</button>
      </div>
    </div>
  </div>`;
}

function decide(name, side, val) {
  if (!decisions[name]) decisions[name] = {};
  // toggle: click again to deselect
  if (decisions[name][side] === val) {
    delete decisions[name][side];
  } else {
    decisions[name][side] = val;
  }
  // re-render just this pair
  const el = document.querySelector(`.pair[data-name="${name}"]`);
  if (el) el.outerHTML = renderPair(name);
  updateCounter();
  saveLocal();
}

function updateCounter() {
  let pending = 0, passed = 0, retry = 0, drop = 0, noneed = 0;
  ASSETS.forEach(n => {
    const s = getStatus(n);
    if (s === 'pending') pending++;
    else if (s === 'pass') passed++;
    else if (s === 'retry') retry++;
    else if (s === 'drop') drop++;
    else if (s === 'noneed') noneed++;
  });
  document.getElementById('counter').textContent =
    `待审 ${pending} / 通过 ${passed} / 继续扣 ${retry} / 放弃 ${drop} / 无需扣 ${noneed} / 共 ${ASSETS.length}`;
}

function saveLocal() {
  localStorage.setItem('cutout_decisions', JSON.stringify(decisions));
}

function loadLocal() {
  try {
    const s = localStorage.getItem('cutout_decisions');
    if (s) Object.assign(decisions, JSON.parse(s));
  } catch(e) {}
}

function exportReport() {
  const report = ASSETS.map(n => {
    const d = decisions[n] || {};
    return {
      asset: n,
      orig_decision: d.orig || 'pending',   // need / noneed / pending
      cut_decision: d.cut || 'pending',       // pass / retry / drop / pending
      status: getStatus(n),
    };
  });
  const json = JSON.stringify(report, null, 2);
  // Download as file
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cutout-audit-report.json';
  a.click();
  URL.revokeObjectURL(url);
  // Also copy to clipboard
  navigator.clipboard.writeText(json).then(() => {
    alert(`审核报告已导出 ${report.length} 条记录\n文件: cutout-audit-report.json\n内容已复制到剪贴板`);
  }).catch(() => {
    alert(`审核报告已导出 ${report.length} 条记录\n文件: cutout-audit-report.json`);
  });
}

// Init
loadLocal();
const container = document.getElementById('container');
container.innerHTML = ASSETS.map(renderPair).join('');
updateCounter();
</script>
</body>
</html>
