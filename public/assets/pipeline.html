<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HISVIA Image Pipeline — Processed Assets</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--border:#e2e4e9;--text:#1a1a2e;--muted:#6b7280;--green:#2e7d32;--blue:#1a6fb2;--orange:#e65100;--red:#c62828}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:10}
.top-bar h1{font-size:18px;margin-bottom:2px}
.top-bar .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px}
.tab-btn{padding:10px 18px;border:none;background:none;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-btn:hover{color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
.filters label{font-size:11px;color:var(--muted);white-space:nowrap}
.filters select{padding:5px 9px;border:1px solid var(--border);border-radius:5px;font-size:12px;outline:none;background:var(--bg)}
.count-badge{font-size:11px;color:var(--muted);margin-left:auto;background:var(--bg);padding:5px 10px;border-radius:16px}
/* Pipeline cards */
.pipeline-grid{display:flex;flex-direction:column;gap:14px;padding:16px 20px}
.pipeline-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;gap:0}
.pipeline-card .orig{width:200px;min-width:200px;background:#fafafa;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);position:relative}
.pipeline-card .orig img{max-width:100%;max-height:180px;object-fit:contain}
.pipeline-card .orig .label{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px}
.pipeline-card .variants{flex:1;display:flex;gap:8px;padding:10px;overflow-x:auto;align-items:flex-start}
.pipeline-card .variant{min-width:180px;max-width:220px;text-align:center}
.pipeline-card .variant .v-img{background:#fafafa;border:1px solid var(--border);border-radius:6px;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px}
.pipeline-card .variant .v-img img{max-width:100%;max-height:120px;object-fit:contain}
.pipeline-card .variant .v-label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:1px}
.pipeline-card .variant .v-size{font-size:8px;color:#aaa}
.pipeline-card .meta{width:180px;min-width:180px;padding:10px;border-left:1px solid var(--border);font-size:10px;display:flex;flex-direction:column;gap:4px}
.pipeline-card .meta .m-label{color:var(--muted);font-size:9px}
.pipeline-card .meta .m-val{color:var(--text);font-weight:500}
.pipeline-card .meta .status-badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9px;font-weight:600}
.s-processed{background:#e8f5e9;color:var(--green)}.s-approved{background:#e3f2fd;color:var(--blue)}
.pipeline-card .actions{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.pipeline-card .actions button{padding:3px 8px;border:1px solid var(--border);border-radius:4px;font-size:9px;cursor:pointer;background:var(--bg)}
.pipeline-card .actions button:hover{background:#e8e8e8}
.pipeline-card .actions .btn-approve{color:var(--green);border-color:var(--green)}
.pipeline-card .actions .btn-delete{color:var(--red);border-color:var(--red)}
.score-bar{display:flex;align-items:center;gap:4px}
.score-bar .sb-bg{flex:1;height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden}
.score-bar .sb-fill{height:100%;border-radius:2px}
.sb-high{background:var(--green)}.sb-mid{background:var(--orange)}.sb-low{background:var(--red)}
.empty{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:900px){
  .pipeline-card{flex-direction:column}
  .pipeline-card .orig{width:100%;min-width:0;height:160px;border-right:none;border-bottom:1px solid var(--border)}
  .pipeline-card .meta{width:100%;min-width:0;border-left:none;border-top:1px solid var(--border)}
}
</style>
</head>
<body>

function sb(v){return v>=0.7?'sb-high':v>=0.5?'sb-mid':'sb-low';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var t=document.getElementById('fType').value;
  var items=DATA;
  if(t) items=DATA.filter(function(d){return d.asset_type===t;});
  document.getElementById('badge').textContent=items.length+' images';
  
  var h='';
  for(var i=0;i<items.length;i++){
    var d=items[i];
    var vars='';
    for(var j=0;j<d.processed_files.length;j++){
      var pf=d.processed_files[j];
      vars+='<div class="variant"><div class="v-img"><img loading="lazy" src="'+pf.path+'" alt=""/></div><div class="v-label">'+pf.type+'</div><div class="v-size">'+pf.width+'x'+pf.height+' '+pf.format+'</div></div>';
    }
    var qp=Math.round(d.quality_score*100);
    var st=d.processing_status;
    h+='<div class="pipeline-card">'+
      '<div class="orig"><img loading="lazy" src="'+d.original_file+'" alt=""/><span class="label">Original</span></div>'+
      '<div class="variants">'+vars+'</div>'+
      '<div class="meta">'+
      '<div class="m-label">File</div><div class="m-val" style="font-size:9px;word-break:break-all">'+esc(d.filename)+'</div>'+
      '<div class="m-label">Type</div><div class="m-val">'+d.asset_type.replace(/_/g,' ')+'</div>'+
      (d.brand?'<div class="m-label">Brand</div><div class="m-val">'+esc(d.brand)+'</div>':'')+
      '<div class="m-label">Quality</div><div class="score-bar"><div class="sb-bg"><div class="sb-fill '+sb(d.quality_score)+'" style="width:'+qp+'%"></div></div><span style="font-size:10px">'+qp+'%</span></div>'+
      '<div class="m-label">Status</div><div><span class="status-badge s-'+st+'">'+st+'</span></div>'+
      '<div class="actions">'+
      '<button onclick="alert("Reprocess: '+d.asset_id+'")" title="Re-run processing">🔄 Reprocess</button>'+
      '<button class="btn-approve" onclick="approve(''+d.asset_id+'')">✓ Approve</button>'+
      '<button class="btn-delete" onclick="alert("Delete variants for: '+d.asset_id+'")">✕</button>'+
      '</div></div></div>';
  }
  document.getElementById('grid').innerHTML=h||'<div class="empty">No results</div>';
}

function approve(id){
  for(var i=0;i<DATA.length;i++){
    if(DATA[i].asset_id===id){DATA[i].processing_status='approved';break;}
  }
  render();
}

render();
