<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>第8页产品 · 行星工程</title>
<style>
:root{--bg:#0a0c10;--surface:#141822;--border:#1d2330;--text:#e6e8ee;--muted:#8c92a0;--accent:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:40px 24px;text-align:center}
header h1{font-size:24px;font-weight:700;margin-bottom:8px}
header p{font-size:14px;color:var(--muted)}
.controls{display:flex;gap:12px;justify-content:center;padding:20px;flex-wrap:wrap}
.toggle{padding:8px 20px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:#cbd1dd;transition:all .15s}
.toggle.active{background:#1c3a5e;color:#60a5fa;border-color:#3b82f6}
.toggle:hover{background:#1c2332}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:0 24px 48px;max-width:1400px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-img{background-image:linear-gradient(45deg,#1a1f2c 25%,transparent 25%),linear-gradient(-45deg,#1a1f2c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1a1f2c 75%),linear-gradient(-45deg,transparent 75%,#1a1f2c 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;background-color:#0b0e14;min-height:220px;display:flex;align-items:center;justify-content:center;padding:16px}
.card-img img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.card-info{padding:12px 16px;border-top:1px solid var(--border)}
.card-info .name{font-size:14px;font-weight:700}
.card-info .meta{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:700;margin-top:6px}
.badge-hd{background:#0c2a1f;color:#4ade80}
.modal{display:none;position:fixed;z-index:1000;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);justify-content:center;align-items:center;cursor:zoom-out;flex-direction:column}
.modal.show{display:flex}
.modal img{max-width:90%;max-height:85vh;object-fit:contain}
.modal .caption{color:var(--muted);font-size:14px;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>ООО «Планетарная Инженерия»</h1>
<p>第8页 · 24个产品 · 去边线+抠图+AI高清</p>
</header>
<div class="controls">
<div class="toggle active" id="tCut" onclick="switchView('cut')">抠图（标准）</div>
<div class="toggle" id="tHd" onclick="switchView('hd')">AI高清（4x）</div>
</div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="this.classList.remove('show')">
<img id="modalImg"/>
<div class="caption" id="modalCap"></div>
</div>
<script>
var ITEMS=[
{id:"p01"},{id:"p02"},{id:"p03"},{id:"p04"},{id:"p05"},
{id:"p06"},{id:"p07"},{id:"p08"},{id:"p09"},{id:"p10"},
{id:"p12"},{id:"p13"},{id:"p14"},{id:"p15"},{id:"p16"},
{id:"p17"},{id:"p18"},{id:"p19"},{id:"p20"},{id:"p21"},
{id:"p22"},{id:"p23"},{id:"p24"},{id:"p25"}
];
var view="cut";
function switchView(v){
view=v;
document.getElementById("tCut").classList.toggle("active",v==="cut");
document.getElementById("tHd").classList.toggle("active",v==="hd");
render();
}
function showModal(src,cap){
document.getElementById("modalImg").src=src;
document.getElementById("modalCap").textContent=cap;
document.getElementById("modal").classList.add("show");
}
function render(){
var grid=document.getElementById("grid");
grid.innerHTML="";
ITEMS.forEach(function(it,idx){
var folder=view==="hd"?"hd/":"";
var src="/assets/cutout/page8/"+folder+it.id+".png";
var isHd=view==="hd";
var card=document.createElement("div");
card.className="card";
card.innerHTML='<div class="card-img"><img src="'+src+'" onclick="showModal(\''+src+'\',\''+it.id+' ('+(isHd?'AI高清 4x':'抠图')+')\')" style="cursor:zoom-in"/></div><div class="card-info"><div class="name">'+it.id+'</div><div class="meta">编号 '+(idx+1)+'/24</div>'+(isHd?'<span class="badge badge-hd">4x AI高清</span>':'')+'</div>';
grid.appendChild(card);
});
}
render();
</script>
</body>
</html>
